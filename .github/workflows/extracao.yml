name: Automação Atende.net

on:
  schedule:
    - cron: '0 9 * * *' # Roda todos os dias às 09:00 UTC
  workflow_dispatch: # Botão para rodar manualmente quando quiser

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências e navegadores
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Executar automação de cliques e captura
        run: python extrair_nuvem.py

      - name: Commitar e enviar JSON atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add licitacao_1044_completa.json
          git commit -m "chore: atualização automática dos dados da licitação 1044" || exit 0
          git push
