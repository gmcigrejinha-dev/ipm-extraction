name: Automação Atende.net

on:
  schedule:
    - cron: '0 9 * * *' # Roda todos os dias às 09:00 UTC
  workflow_dispatch: # Permite rodar manualmente no botão do GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # Permissão necessária para o robô fazer commit e git push
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências e navegadores
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Executar automação de cliques e captura
        run: python params_grid.py # Ajuste para o nome do seu arquivo Python atual

      - name: Commitar e enviar JSONs atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add licitacao_*.json
          git commit -m "chore: atualização automática dos dados de múltiplas licitações" || exit 0
          git push
